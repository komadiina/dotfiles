# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(f9212150)
    col.inactive_border = rgba(59595900)

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Rounded corners so the popin scale reads as circular rather than boxy.
    # Set back to 0 for the old sharp look.
    rounding = 0
    dim_inactive = true
    dim_strength = 0.35

    # Strength of the `dim_around = on` layerrule (walker, per
    # ~/.config/hypr/walker.conf). 0 = no dim, 1 = solid black.
    # Separate knob from dim_strength, which is inactive-window dimming.
    dim_around = 0.66
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Advanced-and-Cool/Animations/
# easeOutBack -- overshoots past 100% then settles, which is what gives the "pop"
bezier = pop, 0.34, 1.56, 0.64, 1

animation = border, 1, 5, pop
animation = borderangle, 1, 10, pop

animation = workspaces, 1, 8, default, fade

# workspace = r[1-9], gapsin:0, gapsout:0

# Fade layer-shell surfaces in (walker, waybar, mako, swayosd).
# Hyprland's animation speed is in deciseconds, so 3 = 300ms.
# layersIn is the map animation + its style; fadeLayersIn is the alpha ramp.
animation = layersIn, 1, 1.8, easeOutQuint, fade
animation = fadeLayersIn, 1, 1.8, almostLinear
