source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    fractional_scaling = 1
    hide_cursor = true  
    fail_timeout = 50
}

background {
    monitor =
    # The live mpvpaper shader wallpaper shows THROUGH this surface:
    # ~/.local/bin/lock-shader enables misc:session_lock_xray, so Hyprland keeps
    # rendering the background layer behind the lock instead of blanking it.
    # This translucent black rect just dims it, roughly matching the old
    # brightness = 0.66. path / blur_passes / brightness / noise / vibrancy all
    # operate on hyprlock's own image asset, which no longer exists here.
    color = rgba(0, 0, 0, 0.35)
}

animations {
    enabled = true
}

label {
    monitor = eDP-1

    position = 0, -525
    halign = center
    valign = center

    font_family = NotoSans
    font_size = 24
    font_weight = bold
    text =  cmd[update:10] echo $(date +%T)
    color = rgba(195, 195, 195, 0.6)
}

label {
    monitor = eDP-1

    position = 0, -490
    halign = center
    valign = center

    font_family = NotoSans-Bold
    font_size = 14
    font_weight = 600
    text = cmd[update:1000] echo $(date +"%a, %b %d" | tr "[:upper:]" "[:lower:]")
    #text =  <span>$TIME</span>
    color = rgba(195, 195, 195, 0.6)
}

input-field {
    monitor =
    size = 150, 30

    position = 0, -565
    halign = center
    valign = center

    inner_color = rgba(125,125,125,0.0)
    outer_color = rgba(125,125,125,0.85)
    outline_thickness = 1

    font_family = NotoSans
    font_color = $font_color

    check_color = $check_color
    placeholder_text = 
    fail_text = <i>:(</i>

    rounding = 1
    shadow_passes = 2
    fade_on_empty = false
    fade_timeout = 100
}


auth {
    fingerprint:enabled = true
}

animation = fadeIn, 1, 10, default, fade
animation = fadeIn, 1, 10, default, fade
animation = inputFieldDots, 1, 5, default, fade
