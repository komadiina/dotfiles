# Workaround for gtk4-layer-shell 1.3.0: its libwayland shim resolves
# dlsym(RTLD_NEXT, "wl_proxy_marshal_array_flags") back to its own symbol and
# self-calls forever, wedging walker at 100% CPU inside gtk_init (no window, no
# activation socket). Preloading the lib puts it first in the symbol search
# order so RTLD_NEXT finds the real libwayland-client. Remove once
# gtk4-layer-shell ships a fix.
[Service]
Environment=LD_PRELOAD=/usr/lib/libgtk4-layer-shell.so.0
